version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: matrimony-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matrimony
    ports:
      - "5432:5432"
    volumes:
      - matrimony_postgres_data:/var/lib/postgresql/data

volumes:
  matrimony_postgres_data:
